name: Deploy ASP.NET Core MVC

on:
  push:
    branches:
      - main

# Không chạy hai lần deploy chồng nhau (app_offline.htm của lần này bị lần kia xoá giữa chừng).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Ví dụ: http://lecture0119.runasp.net/healthz — để trống thì bỏ qua bước kiểm tra.
      APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Cài đặt .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 2. Restore, build và test trước deploy
      - name: Restore
        run: |
          dotnet restore ./DemoMVC.csproj
          dotnet restore ./Tests/DemoMVC.Tests/DemoMVC.Tests.csproj

      - name: Build
        run: dotnet build ./DemoMVC.csproj -c Release --no-restore

      - name: Test
        run: dotnet test ./Tests/DemoMVC.Tests/DemoMVC.Tests.csproj -c Release --no-restore

      # 3. Đóng gói ứng dụng
      - name: Publish project
        run: dotnet publish ./DemoMVC.csproj -c Release -o ./publish --no-restore

      # 3. TẮT SERVER: Tạo và upload app_offline.htm bằng curl (Không làm hỏng file sync state)
      - name: ⛔ Stop Server (Upload app_offline.htm)
        run: |
          echo "<html><body><h1>Updating...</h1></body></html>" > app_offline.htm
          curl -s --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T app_offline.htm "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm"
      # Thêm bước chờ máy chủ giải thoát các tập tin khoá 

      - name: ⏳ Wait for server to release file locks
        run: sleep 15

      # 4. DEPLOY CODE: Chỉ gọi FTP Action 1 lần duy nhất ở đây
      - name: 🚀 Deploy App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./publish/
          server-dir: /wwwroot/
          security: loose
          exclude: |
            **/app_offline.htm

      # 5. BẬT SERVER: Xóa file app_offline.htm bằng curl
      - name: ▶️ Start Server (Delete app_offline.htm)
        if: always()
        run: |
          curl -s --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/" -Q "-DELE /wwwroot/app_offline.htm" || true

      # 6. KIỂM TRA: gọi /healthz (app tự migrate DB và seed tài khoản khi khởi động lần đầu)
      - name: 🩺 Health check
        if: env.APP_HEALTH_URL != ''
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_HEALTH_URL" || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Website không phản hồi HTTP 200 tại APP_HEALTH_URL sau khi deploy."
          exit 1
