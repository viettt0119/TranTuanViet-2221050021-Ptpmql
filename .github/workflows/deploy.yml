name: Deploy ASP.NET Core MVC

on:
  push:
    branches:
      - main

# Không chạy hai lần deploy chồng nhau (app_offline.htm của lần này bị lần kia xoá giữa chừng).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL || 'http://lecture0119.runasp.net/healthz' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Cài đặt .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 2. Restore, build và test trước deploy
      - name: Restore
        run: |
          dotnet restore ./DemoMVC.csproj
          dotnet restore ./Tests/DemoMVC.Tests/DemoMVC.Tests.csproj

      - name: Build
        run: dotnet build ./DemoMVC.csproj -c Release --no-restore

      - name: Test
        run: dotnet test ./Tests/DemoMVC.Tests/DemoMVC.Tests.csproj -c Release --no-restore

      # 3. Đóng gói ứng dụng
      - name: Publish project
        run: dotnet publish ./DemoMVC.csproj -c Release -o ./publish --no-restore

      - name: Verify published app starts
        working-directory: ./publish
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5187
        run: |
          startup_log="$(mktemp)"
          export ConnectionStrings__DefaultConnection="Data Source=$RUNNER_TEMP/publish-smoke.db"
          dotnet DemoMVC.dll > "$startup_log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; rm -f "$startup_log"' EXIT

          for attempt in $(seq 1 30); do
            if [ "$(curl --silent --fail --max-time 2 http://127.0.0.1:5187/healthz)" = "Healthy" ]; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$startup_log"
          echo "::error::Bản publish không khởi động được."
          exit 1

      - name: Put site in maintenance mode
        id: maintenance
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "<html><body><h1>Updating...</h1></body></html>" > app_offline.htm
          curl --silent --show-error --connect-timeout 15 --max-time 45 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file app_offline.htm \
            "ftp://$FTP_SERVER/wwwroot/app_offline.htm"

      - name: Wait for the server to release file locks
        run: sleep 15

      - name: Deploy app
        id: deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./publish/
          server-dir: /wwwroot/
          security: loose
          exclude: |
            **/app_offline.htm

      - name: Bring site online
        if: always() && steps.maintenance.outcome != 'skipped'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --silent --show-error --connect-timeout 15 --max-time 45 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" --quote "DELE /wwwroot/app_offline.htm" \
            --output /dev/null "ftp://$FTP_SERVER/"

      - name: Verify production health
        if: "!cancelled() && steps.deploy.outcome == 'success'"
        run: |
          health_body="$(mktemp)"
          trap 'rm -f "$health_body"' EXIT
          for attempt in $(seq 1 10); do
            status="$(curl --silent --show-error --location --max-redirs 5 \
              --output "$health_body" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 "$APP_HEALTH_URL")" || status="000"
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ] && [ "$(cat "$health_body")" = "Healthy" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Website không trả về HTTP 200 và Healthy tại /healthz sau khi deploy."
          exit 1
